name: GLaDOS 每日签到

on:
  schedule:
    # 北京时间 每天上午 8:00 自动运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 保留手动触发按钮

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: pip install requests
        
      - name: 执行签到
        run: python .github/workflows/checkin.py
        env:
          # 这里的名字要和后面设置的一致
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
